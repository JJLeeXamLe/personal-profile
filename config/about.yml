    - title: "Applied ML Systems & MLOps"
      icon: "config/assets/icons/mlops.svg"
      description: "Building production-grade ML pipelines with Airflow, MLflow, Feast, and CI/CD, enabling reliable experimentation, deployment, and large-scale inference."

SKILLS:
  enabled: true
  label: "Publications & Research Experiences"
  items:
    - title: "MANDO-LLM: Graph Transformers with LLMs for Smart Contract Security (TOSEM 2025)"
      icon: "config/assets/icons/mandollm.svg"
      description: "Proposed a heterogeneous graph transformer framework augmented with large language models for smart contract vulnerability detection. The work bridges graph neural networks, program analysis, and LLM reasoning, demonstrating strong performance gains on real-world blockchain security benchmarks. Link: https://dl.acm.org/doi/10.1145/3765751"

    - title: "FACROC: Fairness-Aware Clustering via ROC Analysis (PAKDD 2025)"
      icon: "config/assets/icons/fairness.svg"
      description: "Introduced a novel fairness metric for clustering based on ROC curve analysis. The study combines statistical learning theory and optimization to evaluate and improve fairness guarantees in unsupervised machine learning. Link: https://arxiv.org/abs/2503.00854"

    - title: "B4E: Secure Digital Credentials with Blockchain & Remote Signing (SOICT 2022)"
      icon: "config/assets/icons/b4e.svg"
      description: "Designed a blockchain-based system for secure digital credential issuance and validation. The project emphasizes system reliability, cryptographic trust, and real-world deployment considerations. Link: https://dl.acm.org/doi/10.1145/3568562.3568656"

    - title: "Structure-Aware Pseudo-Video Traversal for Light Field Compression (ICIP 2026, under submission)"
      icon: "config/assets/icons/reviewer.svg"
      description: "Developed a structure-aware traversal strategy combining contrastive learning and traditional signal processing for efficient light field compression, integrating learning-based models with domain-specific physical structure. Link: https://drive.google.com/file/d/1EaOiqQNk-ykEcJ6nggVb11Y_P__rnT6D/view?pli=1"

    - title: "Reviewer & Subreviewer (AAAI 2025, ACM TIST 2026)"
      icon: "config/assets/icons/laptop-code.svg"
      description: "Served as reviewer and subreviewer for top-tier venues, critically evaluating research on graph neural networks, intelligent security analysis, and advanced machine learning methods, with a strong focus on methodological rigor and novelty."


